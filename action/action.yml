name: 'What It Does'
description: 'Comment on a pull request with what it changed about your application''s behaviour — not which lines moved.'
author: 'Eriksen Labs'

branding:
  icon: 'search'
  color: 'green'

inputs:
  path:
    description: 'Directory to scan, if the application is not at the repository root.'
    required: false
    default: '.'
  fail-on-new:
    description: >-
      Fail the check when the comparison finds something that was not there
      before. Off by default: a tool that breaks the build the day it is
      installed gets uninstalled the same day.
    required: false
    default: 'false'
  comment:
    description: 'Post the result as a pull request comment.'
    required: false
    default: 'true'

outputs:
  changed:
    description: 'Number of behaviours that changed.'
    value: ${{ steps.compare.outputs.changed }}
  new-findings:
    description: 'Number of findings that were not present on the base branch.'
    value: ${{ steps.compare.outputs.new-findings }}
  markdown:
    description: 'The comparison, as markdown.'
    value: ${{ steps.compare.outputs.markdown }}

runs:
  using: 'composite'
  steps:
    # The base branch, scanned first. Shallow is fine: nothing here reads git
    # history any more.
    - name: Check out the base branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: .wid-base

    - name: Check out this branch
      uses: actions/checkout@v4
      with:
        path: .wid-head

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Installed once, into the runner's temp directory rather than the
    # checkout, so nothing appears in the customer's working tree and no
    # lockfile of theirs is touched.
    - name: Install what-it-does
      shell: bash
      run: npm install --no-save --silent --prefix "$RUNNER_TEMP/what-it-does" what-it-does@latest

    - name: Compare behaviour
      id: compare
      shell: bash
      env:
        WID_PATH: ${{ inputs.path }}
        WID_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
      run: node "$GITHUB_ACTION_PATH/run.mjs"

    - name: Comment on the pull request
      if: inputs.comment == 'true' && steps.compare.outputs.markdown != ''
      uses: actions/github-script@v7
      with:
        script: |
          const body = process.env.WID_BODY;
          const marker = '<!-- what-it-does -->';

          // Update the existing comment rather than adding one per push. A bot
          // that leaves a new comment on every commit is a bot people mute.
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const mine = comments.find(
            (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker),
          );

          if (mine) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: mine.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
        github-token: ${{ github.token }}
      env:
        WID_BODY: ${{ steps.compare.outputs.markdown }}
